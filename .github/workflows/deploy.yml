# .github/workflows/deploy.yml
# A GitHub Actions "workflow": automation that GitHub runs for you.
# This one deploys the app to EC2 whenever you push to the main branch.

name: Deploy to EC2          # shows up as the workflow's name in the Actions tab

# ── WHEN does this run? (the trigger) ─────────────────────────────────
on:
  push:
    branches: [ main ]       # run only on a push to the `main` branch
  workflow_dispatch:          # also allow running it manually from the Actions tab

# ── WHAT does it do? (jobs) ───────────────────────────────────────────
jobs:
  deploy:
    runs-on: ubuntu-latest    # GitHub gives us a fresh temporary Linux machine ("runner")

    steps:
      # Step 1: give the runner AWS credentials (from the GitHub Secrets you stored).
      # This official action configures the AWS CLI with our deployer user's keys.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # Step 2: tell AWS SSM to run the deploy commands ON the EC2 instance.
      # We never SSH in — we hand the commands to SSM, which relays them to the
      # instance (addressed by its ID, so it works regardless of the public IP).
      - name: Deploy on EC2 via SSM
        run: |
          # IMPORTANT: AWS-RunShellScript runs as ROOT. Our app lives under
          # ssm-user and uv is on ssm-user's PATH, so we run the real deploy
          # steps AS ssm-user via `runuser`. `set -e` makes the script fail
          # (non-zero exit) if any step fails — so the SSM Status reflects reality.
          command_id=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy learn-ai-agent" \
            --parameters 'commands=[
              "set -e",
              "runuser -l ssm-user -c \"cd /home/ssm-user/learn-ai-agent && git pull origin main && /home/ssm-user/.local/bin/uv sync\"",
              "systemctl restart learn-ai-agent",
              "sleep 3",
              "systemctl is-active learn-ai-agent"
            ]' \
            --query "Command.CommandId" --output text)

          echo "Sent SSM command: $command_id"

          # Wait for the command to finish, then report success/failure.
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          # Print BOTH stdout and stderr of the deploy so we can see what happened.
          echo "----- STDOUT -----"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text
          echo "----- STDERR -----"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" --output text

          # Fail the workflow if the command didn't succeed.
          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)
          echo "Deploy status: $status"
          test "$status" = "Success"
