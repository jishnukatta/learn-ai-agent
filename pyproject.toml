# pyproject.toml — the single "identity card" for a Python project.
# Every modern Python project has one. It replaces the old setup.py/requirements.txt.
# `uv` reads this file to know: what the project is, what Python it needs, and
# which libraries to install.

[project]
name = "learn-ai-agent"           # the project's name
version = "0.1.0"                  # our version (we bump this as it grows)
description = "A personal knowledge assistant — a learning project that grows from a script into a deployed AI agent."
readme = "README.md"
requires-python = ">=3.11"        # we require Python 3.11+ (uv will fetch it for us)

# Dependencies = external libraries this project needs.
# Stage 1 adds two:
#   boto3          — AWS's official Python SDK (how we call Bedrock)
#   python-dotenv  — loads our AWS keys from a local .env file into the program
dependencies = [
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    # Stage 3: expose the agent over HTTP
    "fastapi>=0.110.0",    # the web framework — turns functions into URL endpoints
    "uvicorn>=0.29.0",     # the server that actually runs the FastAPI app
]

# This creates a command named `assistant` that runs the `main` function
# inside the `assistant.cli` module. After `uv sync`, you can run `uv run assistant`.
[project.scripts]
assistant = "assistant.cli:main"

# ── Build configuration ──────────────────────────────────────────────
# Tells the packaging tool (hatchling) where our source code lives.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]
